<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LDCHEKER Panel</title>
<style>
  :root{
    --bg:#000;
    --blue:#00a9ff;
    --blue2:#0079c8;
    --cyan:#00eaff;
    --red:#ff2b35;
    --white:#f7fbff;
    --green:#d9ff00;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:#000;color:#fff}
  body{
    font-family: Georgia, "Times New Roman", serif;
    overflow-x:auto;
  }
  .page{
    width:1116px;
    min-height:1410px;
    margin:0 auto;
    padding:18px 14px 28px;
    position:relative;
    background:#000 url("assets/background.jpg") center top / cover no-repeat;
}
  .row{display:flex;align-items:center;gap:30px}
  .top{
    display:grid;
    grid-template-columns:306px 470px;
    gap:30px;
    margin-bottom:78px;
  }
  .stack{display:flex;flex-direction:column;gap:13px}
  .btn{
    height:50px;
    display:flex;
    align-items:center;
    justify-content:center;
    border:2px solid var(--blue);
    border-radius:8px;
    color:#fff;
    background:linear-gradient(#06243c,#061523);
    box-shadow:
      0 0 0 1px #00558e inset,
      0 0 5px #00bfff,
      0 0 12px rgba(0,170,255,.45) inset;
    text-shadow:0 2px 2px #000;
    font-size:26px;
    font-weight:900;
    letter-spacing:.5px;
    cursor:pointer;
    user-select:none;
    transition:.12s ease;
  }
  .btn:hover{filter:brightness(1.25);transform:translateY(-1px)}
  .btn:active{transform:translateY(1px);filter:brightness(.9)}
  .wide{font-size:25px}
  .country-title{
    position:absolute;
    right:18px;
    top:111px;
    font-family:Arial Black,Impact,sans-serif;
    font-size:32px;
    letter-spacing:1px;
    color:#f8fbff;
    -webkit-text-stroke:2px #1579b8;
    text-shadow:0 0 5px #00d9ff,0 3px 0 #0b3452;
    background:#071b2d;
    border-radius:25px;
    padding:0 11px 3px;
    z-index:3;
  }

  .middle{
    display:grid;
    grid-template-columns:590px 440px;
    gap:42px;
  }

  .left-panel{
    display:grid;
    grid-template-columns:92px 92px;
    gap:9px 16px;
    align-content:start;
    padding-top:48px;
  }
  .code{
    height:51px;
    font:900 31px Arial,sans-serif;
    letter-spacing:1px;
  }
  .code.blue{
    color:#00e8ff;
    background:linear-gradient(#063249,#021622);
    border-color:#008fc5;
  }
  .code.red{
    color:#ffeef0;
    background:linear-gradient(#8c1b25,#351116);
    border-color:#ff3946;
    text-shadow:0 2px 2px #000;
  }

  .countries{
    display:grid;
    grid-template-columns:repeat(5, 76px);
    grid-auto-rows:72px;
    gap:7px 12px;
    padding-top:0;
    align-content:start;
  }
  .country{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    cursor:pointer;
    padding:0;
    border:0;
    background:transparent;
    color:#fff;
    font-family:inherit;
  }
  .flag{
    width:76px;
    height:58px;
    border-radius:7px;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:40px;
    line-height:1;
    background:#0a0a0a;
    border:2px solid #00a6ff;
    box-shadow:0 0 5px #00d5ff, 0 0 10px rgba(0,130,255,.7);
    text-shadow:none;
  }
  .country:nth-child(3n) .flag{border-color:#ff232d;box-shadow:0 0 5px #ff2028,0 0 9px rgba(255,0,0,.55)}
  .country:nth-child(4n) .flag{border-color:#00d9ff}

  .flag img{
    width:100%;
    height:100%;
    display:block;
    object-fit:cover;
  }
  .flag-fallback{display:none}
  .country:hover .flag{
    transform:scale(1.04);
    filter:brightness(1.18);
  }
  .country:active .flag{
    transform:scale(.97);
  }
  .cc{
    margin-top:-1px;
    font:900 18px Arial,sans-serif;
    color:#f4f8ff;
    text-shadow:0 2px 2px #000,0 0 3px #00a9ff;
  }

  .lower-left{
    position:absolute;
    left:14px;
    top:813px;
    width:576px;
    display:grid;
    grid-template-columns:260px 290px;
    gap:10px 24px;
  }
  .lower-left .btn{height:48px;font-size:24px}
  .lower-left .full{grid-column:1/-1}
  .smallwide{font-size:21px!important}

  .actions{
    position:absolute;
    left:14px;
    top:1090px;
    width:575px;
  }
.action-row{display:grid;grid-template-columns:260px 290px;gap:25px;margin-bottom:9px}  .action-row .btn{height:48px;font-size:24px}
  .action-row.single{grid-template-columns:174px 1fr}
  .email{color:#ff1717;font-family:Arial Black,Arial,sans-serif;font-size:23px!important}
  .reset{
    width:545px;
    margin-top:12px;
    color:#dfff00;
    font-family:Arial Black,Arial,sans-serif;
    font-size:22px!important;
  }

  .news{
    position:absolute;
    right:14px;
    top:1050px;
    width:472px;
  }
  .news-title{
    width:330px;
    margin:0 auto 10px;
    height:53px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(#0b304b,#101113);
    border:2px solid #00aaff;
    box-shadow:0 0 7px #00bfff inset,0 0 6px #007ec8;
    clip-path:polygon(7% 0,93% 0,100% 48%,93% 100%,7% 100%,0 48%);
    font-size:25px;
    font-style:italic;
    font-weight:900;
    text-shadow:0 2px 2px #000;
  }
  .device-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px 24px;
  }
  .device-grid .btn{height:48px;font-size:24px}

  .country-info{
    position:absolute;
    right:14px;
    bottom:58px;
    width:440px;
    height:55px;
    border:2px solid #00a9ff;
    border-radius:6px;
    background:#fff;
    box-shadow:0 0 7px #00cfff;
    opacity:.95;
  }

  /* simple inline flag look; emoji remain readable on Windows/Chrome */
  .flag span{filter:drop-shadow(0 1px 1px #000)}
  .hint{
    position:fixed;left:50%;bottom:14px;transform:translateX(-50%);
    padding:7px 14px;border-radius:7px;
    background:#071827;border:1px solid #008fd0;
    box-shadow:0 0 8px #008fd0;color:#bfeeff;
    font:13px Arial,sans-serif;opacity:0;pointer-events:none;
    transition:.2s;z-index:10
  }
  .hint.show{opacity:1}
</style>
</head>

<script>
  // Load country flags from assets/flag first, then assets/bendera.
  document.querySelectorAll('.country .flag img').forEach(img=>{
    img.addEventListener('error', function(){
      const code=this.closest('.country')?.dataset.flagCode || this.closest('.country')?.dataset.country || '';
      const tries=[
        'assets/flag/'+code.toLowerCase()+'.jpg',
        'assets/flag/'+code.toLowerCase()+'.jpeg',
        'assets/flag/'+code.toLowerCase()+'.webp',
        'assets/bendera/'+code.toLowerCase()+'.png',
        'assets/bendera/'+code.toLowerCase()+'.jpg',
        'assets/bendera/'+code.toLowerCase()+'.jpeg',
        'assets/bendera/'+code.toLowerCase()+'.webp'
      ];
      const i=Number(this.dataset.tryIndex || 0);
      if(i < tries.length){
        this.dataset.tryIndex=String(i+1);
        this.src=tries[i];
      }else{
        this.style.display='none';
        const fb=this.nextElementSibling;
        if(fb) fb.style.display='block';
      }
    });
  });

  // Demo interactions: every button shows its label.
  document.querySelectorAll('button').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const hint=document.getElementById('hint');
      hint.textContent='Dipilih: '+btn.textContent.trim();
      hint.classList.add('show');
      clearTimeout(window.__hintTimer);
      window.__hintTimer=setTimeout(()=>hint.classList.remove('show'),1100);
    });
  });

  document.querySelectorAll('.country').forEach(item=>{
    item.addEventListener('click',(e)=>{
      e.stopPropagation();
      const code=item.dataset.country || item.querySelector('.cc').textContent;
      const hint=document.getElementById('hint');
      hint.textContent='Country: '+code;
      hint.classList.add('show');
      clearTimeout(window.__hintTimer);
      window.__hintTimer=setTimeout(()=>hint.classList.remove('show'),1100);
    });
  });
</script>
